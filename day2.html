<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbellion — Day 2 Skills</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:50px 20px; }
  .title { font-size:26px; font-weight:900; text-align:center; margin-bottom:6px; }
  .subtitle { color:#999; font-size:13px; text-align:center; margin-bottom:16px; }
  .progress-row { display:flex; gap:5px; width:100%; max-width:500px; margin-bottom:24px; }
  .segment { flex:1; height:6px; border-radius:3px; background:#2a2a2a; }
  .segment.done { background:#c6ff1a; }
  .center-box { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; max-width:500px; }
  .tag { color:#c6ff1a; font-size:14px; font-weight:800; letter-spacing:2px; margin-bottom:16px; }
  .set-title { font-size:24px; font-weight:800; text-align:center; margin-bottom:16px; }
  .instructions { color:#ccc; font-size:14px; text-align:center; line-height:20px; margin-bottom:30px; padding:0 8px; }
  .btn { background:#c6ff1a; color:#0a0a0a; border:none; border-radius:10px; padding:16px 40px; font-weight:700; font-size:16px; cursor:pointer; }
  .demo-video { width:100%; max-width:340px; border-radius:14px; margin-bottom:22px; background:#000; }
  .btn-outline { background:transparent; border:1px solid #c6ff1a; color:#c6ff1a; }
  .rest-label { color:#c6ff1a; font-size:15px; font-weight:800; letter-spacing:3px; margin-bottom:10px; }
  .rest-timer { font-size:60px; font-weight:900; margin-bottom:18px; }
  .rest-hint { color:#666; font-size:12px; }
  .skill-timer-corner { position:fixed; top:16px; right:16px; background:#141414; border:1px solid #2a2a2a; border-radius:10px; padding:8px 14px; font-weight:900; font-size:18px; color:#c6ff1a; }
  .flow-rep { color:#666; font-size:12px; letter-spacing:1px; margin-bottom:8px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); align-items:center; justify-content:center; padding:24px; z-index:100; }
  .modal-overlay.show { display:flex; }
  .modal-card { background:#141414; border:1px solid #242424; border-radius:18px; padding:26px; width:100%; max-width:420px; text-align:center; }
  .modal-header { font-size:18px; font-weight:900; letter-spacing:0.5px; margin-bottom:18px; }
  .modal-question { color:#ccc; font-size:16px; font-weight:700; text-transform:uppercase; margin-bottom:26px; line-height:22px; }
  .modal-btns { display:flex; gap:12px; }
  .modal-btn { flex:1; padding:16px; border-radius:12px; border:none; font-weight:900; font-size:15px; cursor:pointer; }
  .yes-btn { background:#c6ff1a; color:#0a0a0a; }
  .no-btn { background:#ff3b3b; color:#0a0a0a; }
  .levelup-title { color:#c6ff1a; font-size:28px; font-weight:900; margin-bottom:16px; letter-spacing:1px; }
  .levelup-sub { color:#ccc; font-size:14px; line-height:21px; margin-bottom:24px; }
  .continue-btn { background:#c6ff1a; color:#0a0a0a; border:none; border-radius:12px; padding:15px 40px; font-weight:900; font-size:15px; cursor:pointer; }
  .level-link { position:fixed; top:16px; left:16px; font-size:12px; color:#666; text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>
  <div class="level-link" onclick="window.location.href='dashboard.html'">← Dashboard</div>
  <div class="title">DAY 2 SKILLS</div>
  <div class="subtitle" id="subtitle"></div>
  <div class="progress-row" id="progressRow"></div>
  <div class="center-box" id="centerBox"></div>

  <div class="modal-overlay" id="gatekeeperModal">
    <div class="modal-card" id="gatekeeperContent"></div>
  </div>

  <script>
    const API_BASE = '/api';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'auth.html';
    const headers = { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };

    let state = null, blocks = [], index = 0, restInterval = null, skillInterval = null;

    // ---- Notifications ----
    async function requestNotifyPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        try { await Notification.requestPermission(); } catch {}
      }
    }
    async function notify(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        const reg = await navigator.serviceWorker.ready;
        reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png' });
      } catch {}
    }

    // ---- Build the session as a flat list of blocks ----
    function buildBlocks(s) {
      const list = [];
      const pushSet = (block) => list.push(block);

      // 3x Pike Push-ups, always first
      for (let i = 1; i <= 3; i++) {
        pushSet({ kind: 'pike', label: 'Pike Push-Ups', instructions: `Set ${i} of 3 — go until absolute failure.`, setPos: i, total: 3, video: 'pike-pushups.mp4' });
        pushSet({ kind: 'rest', seconds: 120 });
      }

      if (s.isMaintenance) {
        pushSet({ kind: 'flow', flow: s.flows.flowBFinal, tag: 'Master Pushing Flow' });
        pushSet({ kind: 'rest', seconds: 120 });
        pushSet({ kind: 'flow', flow: s.flows.flowC, tag: 'Master Pulling Flow', isLast: true });
      } else {
        // Warmups from backend
        (s.warmups || []).forEach((w) => {
          if (w.kind === 'flow') {
            pushSet({ kind: 'flow', flow: s.flows[w.flowKey], tag: 'Warmup Flow' });
          } else if (w.kind === 'hold' && w.targetSeconds) {
            pushSet({ kind: 'warmup-hold', label: w.label, seconds: w.targetSeconds });
          } else {
            pushSet({ kind: 'warmup-manual', label: w.label });
          }
          pushSet({ kind: 'rest', seconds: 120 });
        });

        // Today's new/untested skill — 20 min window, then straight to gatekeeper
        pushSet({ kind: 'skill', label: s.label, target: s.target, type: s.type, video: s.video, isLast: true });
      }

      return list;
    }

    function renderProgress() {
      const row = document.getElementById('progressRow');
      row.innerHTML = '';
      const total = blocks.length;
      for (let i = 0; i < total; i++) {
        const seg = document.createElement('div');
        seg.className = 'segment' + (i <= index ? ' done' : '');
        row.appendChild(seg);
      }
    }

    function clearTimers() {
      if (restInterval) clearInterval(restInterval);
      if (skillInterval) clearInterval(skillInterval);
    }

    function render() {
      clearTimers();
      const block = blocks[index];
      renderProgress();
      const box = document.getElementById('centerBox');
      document.getElementById('subtitle').textContent = state.isMaintenance ? 'GOD-MODE ROUTINE' : `Level ${state.currentStep}: ${state.label}`;

      if (block.kind === 'pike') {
        const videoTag = block.video
          ? `<video class="demo-video" src="videos/${block.video}" autoplay muted loop playsinline disablePictureInPicture controlsList="nodownload noremoteplayback nofullscreen" oncontextmenu="return false" onerror="this.style.display='none'"></video>`
          : '';
        box.innerHTML = `
          <div class="set-title">${block.label}</div>
          ${videoTag}
          <div class="instructions">${block.instructions}</div>
          <button class="btn" onclick="advance()">Done</button>
        `;
        return;
      }

      if (block.kind === 'rest') {
        renderRest(block.seconds);
        return;
      }

      if (block.kind === 'warmup-hold') {
        renderStartThen(`Warmup: ${block.label}`, `Hold for ${block.seconds}s once you start.`, () => renderHoldTimer(block.label, block.seconds));
        return;
      }

      if (block.kind === 'warmup-manual') {
        renderStartThen(`Warmup: ${block.label}`, `Complete it, then tap Done.`, () => {
          box.innerHTML = `
            <div class="set-title">${block.label}</div>
            <button class="btn" onclick="advance()">Done</button>
          `;
        });
        return;
      }

      if (block.kind === 'flow') {
        renderStartThen(block.tag, `${block.flow.name} — ${block.flow.reps} reps`, () => runFlow(block.flow, block.isLast));
        return;
      }

      if (block.kind === 'skill') {
        renderStartThen(`Level ${state.currentStep}: ${block.label}`, `Target: ${block.target}. You'll have 20 minutes.`, () => runSkillTimer(block), block.video);
        return;
      }
    }

    function renderStartThen(title, sub, onStart, video) {
      const box = document.getElementById('centerBox');
      const videoTag = video
        ? `<video class="demo-video" src="videos/${video}" autoplay muted loop playsinline disablePictureInPicture controlsList="nodownload noremoteplayback nofullscreen" oncontextmenu="return false" onerror="this.style.display='none'"></video>`
        : '';
      box.innerHTML = `
        <div class="tag">${state.isMaintenance ? '' : ('Level ' + state.currentStep)}</div>
        <div class="set-title">${title}</div>
        ${videoTag}
        <div class="instructions">${sub}</div>
        <button class="btn" id="startBtn">Start</button>
      `;
      document.getElementById('startBtn').onclick = onStart;
    }

    function renderRest(seconds) {
      const box = document.getElementById('centerBox');
      let timeLeft = seconds;
      box.innerHTML = `<div class="rest-label">REST</div><div class="rest-timer" id="timer">2:00</div><div class="rest-hint">Auto-advancing when timer hits 0</div>`;
      restInterval = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
        if (timeLeft <= 0) { clearInterval(restInterval); notify('Rest over', "Let's go — next set is up."); advance(); }
      }, 1000);
    }

    function renderHoldTimer(label, seconds) {
      const box = document.getElementById('centerBox');
      let timeLeft = seconds;
      box.innerHTML = `<div class="set-title">${label}</div><div class="rest-timer" id="timer">${seconds}s</div>`;
      restInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = `${Math.max(timeLeft,0)}s`;
        if (timeLeft <= 0) { clearInterval(restInterval); advance(); }
      }, 1000);
    }

    function runFlow(flow, isLast) {
      const box = document.getElementById('centerBox');
      const queue = [];
      for (let r = 1; r <= flow.reps; r++) {
        flow.sequence.forEach((seg) => queue.push({ ...seg, rep: r }));
      }
      let qi = 0;

      function playSegment() {
        if (qi >= queue.length) {
          if (isLast) { showGatekeeper(); } else { advance(); }
          return;
        }
        const seg = queue[qi];
        let timeLeft = seg.seconds;
        box.innerHTML = `
          <div class="flow-rep">REP ${seg.rep}/${flow.reps}</div>
          <div class="set-title">${seg.label}</div>
          <div class="rest-timer" id="timer">${timeLeft}s</div>
        `;
        restInterval = setInterval(() => {
          timeLeft--;
          document.getElementById('timer').textContent = `${Math.max(timeLeft,0)}s`;
          if (timeLeft <= 0) {
            clearInterval(restInterval);
            qi++;
            playSegment();
          }
        }, 1000);
      }
      playSegment();
    }

    function runSkillTimer(block) {
      const box = document.getElementById('centerBox');
      let secondsLeft = 20 * 60;
      box.innerHTML = `
        <div class="skill-timer-corner" id="skillTimer">20:00</div>
        <div class="set-title">${block.label}</div>
        <div class="instructions">Target: ${block.target}. Hit Done the moment you achieve it — or the timer runs out and we ask anyway.</div>
        <button class="btn" onclick="finishSkillAttempt()">Done</button>
      `;
      skillInterval = setInterval(() => {
        secondsLeft--;
        const m = Math.floor(secondsLeft / 60), s = secondsLeft % 60;
        const el = document.getElementById('skillTimer');
        if (el) el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
        if (secondsLeft <= 0) {
          clearInterval(skillInterval);
          notify("Time's up", 'Did you hit it?');
          finishSkillAttempt();
        }
      }, 1000);
    }

    function finishSkillAttempt() {
      clearTimers();
      showGatekeeper();
    }

    function advance() {
      clearTimers();
      if (index + 1 >= blocks.length) { showGatekeeper(); return; }
      index++;
      render();
    }

    function showGatekeeper() {
      document.getElementById('gatekeeperContent').innerHTML = `
        <div class="modal-header">SESSION COMPLETE</div>
        <div class="modal-question">${state.question}</div>
        <div class="modal-btns">
          <button class="modal-btn yes-btn" onclick="answerGatekeeper(true)">YES</button>
          <button class="modal-btn no-btn" onclick="answerGatekeeper(false)">NO</button>
        </div>
      `;
      document.getElementById('gatekeeperModal').classList.add('show');
    }

    async function answerGatekeeper(passed) {
      const res = await fetch(`${API_BASE}/day2?action=gatekeeper`, { method: 'POST', headers, body: JSON.stringify({ passed }) });
      const data = await res.json();

      if (data.leveledUp) {
        document.getElementById('gatekeeperContent').innerHTML = `
          <div class="levelup-title">LEVEL UP!</div>
          <div class="levelup-sub">Your mastered move has been added to your warmup, and the next skill is unlocked.</div>
          <button class="continue-btn" onclick="window.location.href='dashboard.html'">Continue</button>
        `;
      } else {
        window.location.href = 'dashboard.html';
      }
    }

    async function init() {
      requestNotifyPermission();
      const res = await fetch(`${API_BASE}/day2?action=state`, { headers });
      state = await res.json();
      blocks = buildBlocks(state);
      render();
    }

    init();
  </script>
</body>
</html>
