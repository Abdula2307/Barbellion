<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbellion — Access Account</title>

<!-- PWA Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barbellion">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #242424;
    --lime: #c6ff1a;
    --gray: #888;
    --gray-light: #ccc;
    --white: #ffffff;
  }

  body {
    background-color: var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .auth-card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }

  .brand-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .brand-logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .brand-subtitle {
    font-size: 13px;
    color: var(--gray);
  }

  .security-notice {
    background-color: rgba(198, 255, 26, 0.06);
    border: 1px solid rgba(198, 255, 26, 0.2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 24px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .security-icon {
    font-size: 16px;
    line-height: 1;
    margin-top: 2px;
  }

  .security-text {
    font-size: 12px;
    color: var(--gray-light);
    line-height: 1.45;
  }

  .security-text strong {
    color: var(--lime);
    font-weight: 700;
  }

  .tab-buttons {
    display: flex;
    background-color: #0d0d0d;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--gray);
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tab-btn.active {
    background-color: var(--card);
    color: var(--lime);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--gray-light);
    margin-bottom: 6px;
  }

  .form-group input, .form-group select {
    width: 100%;
    background-color: #0d0d0d;
    border: 1px solid var(--border);
    color: var(--white);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--lime);
  }

  .pwd-hints {
    font-size: 11px;
    color: var(--gray);
    margin-top: 6px;
    line-height: 1.4;
  }

  .btn-submit {
    width: 100%;
    background-color: var(--lime);
    color: var(--bg);
    border: none;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s ease;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
  }

  .error-msg {
    color: #ff4d4d;
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
    display: none;
  }

  .back-home {
    margin-top: 24px;
    font-size: 12px;
    color: var(--gray);
    text-decoration: none;
    display: inline-block;
  }

  .back-home:hover {
    color: var(--white);
  }
</style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo">BARBELLION</div>
      <div class="brand-subtitle">Train with intent</div>
    </div>

    <div class="security-notice">
      <div class="security-icon">🛡️</div>
      <div class="security-text">
        <strong>Automatic Security Refresh:</strong> Sessions auto-expire after 30 days of inactivity to keep your account secure. Your workout progress & nutrition data remain 100% saved!
      </div>
    </div>

    <div class="tab-buttons">
      <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Log In</button>
      <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <form id="authForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" placeholder="Enter your username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password">
        <div class="pwd-hints" id="passwordHint" style="display:none;">
          Must be 8+ characters with at least one letter and one number.
        </div>
      </div>

      <div class="form-group" id="countryGroup" style="display:none;">
        <label for="country">Country</label>
        <select id="country">
          <option value="Pakistan">Pakistan</option>
          <option value="India">India</option>
          <option value="United States">United States</option>
          <option value="United Kingdom">United Kingdom</option>
          <option value="Canada">Canada</option>
          <option value="Australia">Australia</option>
          <option value="UAE">UAE</option>
          <option value="Saudi Arabia">Saudi Arabia</option>
          <option value="Germany">Germany</option>
          <option value="France">France</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Log In</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <a href="index.html" class="back-home">← Back to Home Page</a>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }

    let currentMode = 'login';

    function switchTab(mode) {
      currentMode = mode;
      const loginTabBtn = document.getElementById('loginTabBtn');
      const signupTabBtn = document.getElementById('signupTabBtn');
      const countryGroup = document.getElementById('countryGroup');
      const passwordHint = document.getElementById('passwordHint');
      const submitBtn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      if (mode === 'signup') {
        loginTabBtn.classList.remove('active');
        signupTabBtn.classList.add('active');
        countryGroup.style.display = 'block';
        passwordHint.style.display = 'block';
        submitBtn.textContent = 'Create Account';
      } else {
        signupTabBtn.classList.remove('active');
        loginTabBtn.classList.add('active');
        countryGroup.style.display = 'none';
        passwordHint.style.display = 'none';
        submitBtn.textContent = 'Log In';
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const country = document.getElementById('country').value;
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      const endpoint = `/api/auth?action=${currentMode}`;
      const payload = currentMode === 'signup' 
        ? { username, password, country } 
        : { username, password };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.message || 'Authentication failed.';
          errorMsg.style.display = 'block';
          return;
        }

        localStorage.setItem('token', data.token);

        if (data.isNewUser) {
          window.location.href = 'onboarding.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
