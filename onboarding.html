<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbellion — Setup</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:420px; }
  .brand { font-size:34px; font-weight:900; text-align:center; letter-spacing:1px; margin-bottom:100px; }
  .title { font-size:20px; font-weight:800; text-align:center; margin-bottom:30px; }
  label { display:block; color:#999; font-size:12px; font-weight:700; margin:16px 0 8px; letter-spacing:0.5px; }
  input { width:100%; padding:14px; background:#161616; border:1px solid #2a2a2a; border-radius:10px; color:#fff; font-size:15px; }
  input:focus { outline:none; border-color:#c6ff1a; }
  .submit { width:100%; background:#c6ff1a; color:#0a0a0a; border:none; padding:17px; border-radius:10px; font-weight:900; font-size:14px; letter-spacing:0.5px; margin-top:32px; cursor:pointer; }
  .error { color:#ff6b6b; font-size:13px; margin-top:12px; text-align:center; display:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">BARBELLION</div>
    <div class="title">YOUR PHYSICAL PROFILE</div>

    <label>CURRENT WEIGHT (KG)</label>
    <input type="number" id="weight" placeholder="70">

    <label>CURRENT HEIGHT (CM)</label>
    <input type="number" id="height" placeholder="175">

    <button class="submit" id="submitBtn" onclick="handleSubmit()">CONTINUE</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const API_BASE = 'https://YOUR-VERCEL-URL.vercel.app/api';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'auth.html';

    async function handleSubmit() {
      const weight = parseInt(document.getElementById('weight').value, 10);
      const height = parseInt(document.getElementById('height').value, 10);
      const errorEl = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');

      if (!weight || !height) {
        errorEl.textContent = 'Fill in weight and height.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = '...';

      try {
        const res = await fetch(`${API_BASE}/user?action=onboarding`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ current_weight: weight, height }),
        });
        if (!res.ok) throw new Error();
        window.location.href = 'dashboard.html';
      } catch {
        errorEl.textContent = 'Something went wrong.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'CONTINUE';
      }
    }
  </script>
</body>
</html>
